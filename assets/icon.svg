<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sbAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="sbShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sbBg)"/>
  <!-- Subtle Top Glass Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sbShine)"/>
  <!-- Crisp Inner Border -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
  <!-- Minimalist Window Accent Dots -->
  <circle cx="116" cy="94" r="11" fill="#ff5f56"/>
  <circle cx="152" cy="94" r="11" fill="#ffbd2e"/>
  <circle cx="188" cy="94" r="11" fill="#27c93f"/>
  <!-- Bold SB Monogram -->
  <text x="256" y="318" text-anchor="middle" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Segoe UI, Arial, sans-serif" font-weight="800" font-size="224" letter-spacing="-8">SB</text>
  <!-- Glowing Code Editor Accent Bar -->
  <rect x="120" y="366" width="212" height="24" rx="12" fill="url(#sbAccent)"/>
  <rect x="350" y="366" width="42" height="24" rx="12" fill="#34d399"/>
</svg>
